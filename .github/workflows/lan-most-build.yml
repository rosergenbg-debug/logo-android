name: LAN Most Android APK
on:
  push:
    branches: [lan-most-ci-build-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract LAN Most Android project
        run: |
          mkdir -p lan-most-app
          cat lan-most-src/part*.b64 | base64 --decode > source.tar.xz
          echo '83bceb3e477ba1dee01d96508ef79d34e0139406a5410ee2632aec6915a90dec  source.tar.xz' | sha256sum -c -
          tar -xJf source.tar.xz -C lan-most-app
          find lan-most-app -type f | sort
      - name: Install SDK platform 35
        run: /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and sign debug Android APK
        run: gradle --no-daemon -p lan-most-app :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Most-Android-APK
          path: lan-most-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
